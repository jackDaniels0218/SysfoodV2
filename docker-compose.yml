# Uso: docker compose up
# Luego abra http://localhost:8000  (usuario admin@sysfood.local / Sysfood2025*)
# Usa PostgreSQL, el mismo motor que el despliegue en Render (render.yaml).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sysfood
      POSTGRES_USER: sysfood
      POSTGRES_PASSWORD: sysfood
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysfood -d sysfood"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sysfood
      DB_USER: sysfood
      DB_PASSWORD: sysfood
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: clave-de-demostracion-cambiela-en-produccion-123456789
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      SITE_URL: http://localhost:8000
      CARGAR_DEMO: "1"
    volumes:
      - documentos:/app/protegido
      - respaldos:/app/backups
    restart: unless-stopped

volumes:
  datos_postgres:
  documentos:
  respaldos:
