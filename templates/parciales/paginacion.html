{% if pagina.has_other_pages %}
<nav aria-label="Paginación"><ul class="pagination pagination-sm justify-content-center flex-wrap">
  {% if pagina.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ pagina.previous_page_number }}">Anterior</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span></li>
  {% if pagina.has_next %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ pagina.next_page_number }}">Siguiente</a></li>{% endif %}
</ul></nav>
{% endif %}
