# Integración continua: estilo, análisis estático, migraciones y pruebas sobre PostgreSQL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sysfood
          POSTGRES_USER: sysfood
          POSTGRES_PASSWORD: sysfood
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sysfood"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_ENGINE: postgresql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: sysfood
      DB_USER: sysfood
      DB_PASSWORD: sysfood
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Estilo (ruff format)
        run: ruff format --check .
      - name: Análisis estático (ruff check)
        run: ruff check .
      - name: Revisión de Django
        run: python manage.py check
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: coverage run manage.py test --noinput && coverage report --skip-covered --fail-under=80
