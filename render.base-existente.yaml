# Despliegue en Render (Blueprint) usando una base PostgreSQL que YA existe en su cuenta.
# Render solo permite una base gratuita por cuenta; por eso este archivo no crea ninguna.
# Al aplicar el Blueprint, Render le pedirá DATABASE_URL: pegue la «Internal Database URL» de su base
# (Dashboard › su base › Connections). Para crear una base nueva junto con el servicio use
# render.yaml (elija ese archivo en Blueprint › Settings).
# Al terminar, abra https://<nombre>.onrender.com e ingrese con admin@sysfood.local / Sysfood2025*
# y cambie esa contraseña de inmediato.

services:
  - type: web
    name: sysfood
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false          # pegue aquí la Internal Database URL de su base existente
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_HTTPS
        value: "1"
      - key: CARGAR_DEMO       # "1" carga los datos de demostración la primera vez; "0" crea solo el administrador.
        value: "1"
      - key: TAREAS_AUTOMATICAS
        value: "1"
      # Opcionales: correo SMTP, asistente con Claude y WhatsApp (ver README).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    # Los documentos cargados se guardan en /app/protegido. En el plan gratuito el disco se borra en cada
    # despliegue; para conservarlos, use un plan pago y descomente el disco persistente:
    # disk:
    #   name: documentos
    #   mountPath: /app/protegido
    #   sizeGB: 1
